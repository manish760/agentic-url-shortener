server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:shortener;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  base-url: ${BASE_URL:http://localhost:8080}
